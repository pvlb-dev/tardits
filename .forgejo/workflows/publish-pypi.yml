name: Publish to PyPI

# The public PyPI leg. It is skipped automatically while the PYPI_TOKEN secret
# is absent, so a missing PyPI credential never blocks the Forgejo registry
# publish. A manual run is a dry run: build and check only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: docker
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Verify the release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          test -n "$version"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match pyproject version v$version. Bump pyproject.toml or retag."
            exit 1
          fi

      - name: Build the distributions
        run: ~/.local/bin/uv build

      - name: Check the package metadata
        run: ~/.local/bin/uvx twine check dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -eu
          if [ -z "${PYPI_TOKEN:-}" ]; then
            echo "PYPI_TOKEN is not set; skipping the PyPI publish."
            exit 0
          fi
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n1)"
          if curl -fsS -o /dev/null "https://pypi.org/pypi/tardits/$version/json"; then
            echo "tardits $version is already on PyPI; nothing to do."
            exit 0
          fi
          ~/.local/bin/uv publish --token "$PYPI_TOKEN" dist/*
