# mlflow needed for this config to work!

device: "auto" # Choices: "auto", "cuda", "cpu", "mps"
seed: 1337

model:
  type: "Complex" # Choices: Real, Complex, Quat, Octo, Sedenion
  block_size: 128
  n_head: 4
  n_embd: 64
  n_layer: 4
  dropout: 0.2

trainer:
  batch_size: 32
  max_iters: 120
  eval_interval: 500
  learning_rate: 0.001
  eval_iters: 200
  save_interval: 0
  checkpoint: "examples/saved/test_GPT.pt"

mlflow:
  experiment: "interference"
  log_interval: 1
  deep_log_interval: 1
  system_metrics: false

data:
  input_path: "examples/data/shakespeare.txt"
  vocab_save_path: "examples/saved/test_char.txt"
