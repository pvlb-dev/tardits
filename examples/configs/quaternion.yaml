device: "auto" # Choices: "auto", "cuda", "cpu", "mps"
seed: 1337

model:
  arch: hyper # real | hyper | rat
  level: 2 # Quaternion
  block_size: 64
  n_head: 4
  n_embd: 24
  n_layer: 4
  dropout: 0.2

trainer:
  batch_size: 32
  max_iters: 5000
  eval_interval: 500
  learning_rate: 0.0005
  eval_iters: 20
  save_interval: 6000
  checkpoint: "examples/saved/Quaternion.pt"

mlflow:
  experiment: "LinA_init"
  log_interval: 10
  deep_log_interval: 0
  system_metrics: false

data:
  input_path: "examples/data/shakespeare.txt"
  vocab_save_path: "examples/saved/char.txt"
