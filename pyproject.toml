[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "tardits"
version = "0.2.1"
description = "Text And Rotating Dimensions In Token Space"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
]

[project.optional-dependencies]
mlflow = [
    "mlflow>=3.14.0",
    "matplotlib>=3.11.1",
    "psutil>=7.2.2",
]

[project.scripts]
ttrain = "tardits.train:main"
tgen = "tardits.gen:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tardits"]

